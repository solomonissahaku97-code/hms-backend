# HMS Nginx Configuration
#
# Routes traffic to all HMS microservices.
# Single entry point: http://localhost:80
#
# Routes:
#   /api/v1/notifications/  -> notifications-service
#   /api/v1/lab/            -> lab-service
#   /api/v1/pharmacy/       -> pharmacy-service
#   /api/v1/billing/        -> billing-service
#   /api/v1/claims/         -> claims-service
#   /                      -> backend (main monolith)

events {
    worker_connections 1024;
}

http {
    # ── Upstreams ────────────────────────────────────────────────────────
    upstream hms_backend {
        server backend:5008;
    }

    upstream pharmacy_service {
        server pharmacy-service:3001;
    }

    upstream billing_service {
        server billing-service:8001;
    }

    upstream claims_service {
        server claims-service:3002;
    }

    upstream admission_service {
        server admission-service:3003;
    }

    upstream lab_service {
        server lab-service:5012;
    }

    upstream store_service {
        server store-service:3004;
    }

    upstream theatre_service {
        server theatre-service:3005;
    }

    upstream consultation_service {
        server consultation-service:3006;
    }

    upstream maternity_service {
        server maternity-service:3007;
    }

    upstream websocket_service {
        server websocket-service:3010;
    }

    # ── Rate Limiting ────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=notifications:10m rate=60r/s;

    # ── Logging ──────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'upstream=$upstream_addr response_time=$upstream_response_time';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    server {
        listen 80;
        server_name _;

        # ── Client body size (for file uploads) ──────────────────────────
        client_max_body_size 50m;

        # ── Health check for Nginx itself ────────────────────────────────
        location /nginx/health {
            return 200 '{"status":"OK","service":"nginx"}';
            add_header Content-Type application/json;
        }

        # ── Claims Service ───────────────────────────────────────────────
        location /api/v1/claims/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://claims_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # ── Admission Service ──────────────────────────────────────
        location /api/v1/admission/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://admission_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /admission/health {
            proxy_pass http://admission_service/health;
            proxy_set_header Host $host;
        }

        # ── Lab Service ──────────────────────────────────────────────
        location /api/v1/lab/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://lab_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /lab/health {
            proxy_pass http://lab_service/health;
            proxy_set_header Host $host;
        }

        # ── Store Service ───────────────────────────────────────────
        location /api/v1/store/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://store_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /store/health {
            proxy_pass http://store_service/health;
            proxy_set_header Host $host;
        }

        location /store/docs {
            proxy_pass http://store_service/docs;
            proxy_set_header Host $host;
        }

        # ── Theatre Service ───────────────────────────────────────
        location /api/v1/theatre/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://theatre_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /theatre/health {
            proxy_pass http://theatre_service/health;
            proxy_set_header Host $host;
        }

        # ── Consultation Service ─────────────────────────────────
        location /api/v1/consultation/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://consultation_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /consultation/health {
            proxy_pass http://consultation_service/health;
            proxy_set_header Host $host;
        }

        # ── Maternity Service ──────────────────────────────────────
        location /api/v1/maternity/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://maternity_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /maternity/health {
            proxy_pass http://maternity_service/health;
            proxy_set_header Host $host;
        }

        # ── WebSocket Service ────────────────────────────────────────
        location /api/v1/ws/ {
            proxy_pass http://websocket_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ws/health {
            proxy_pass http://websocket_service/health;
            proxy_set_header Host $host;
        }

        # Socket.IO WebSocket upgrade
        location /socket.io/ {
            proxy_pass http://websocket_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        # ── Claims Service Docs ──────────────────────────────────────────
        location /claims/docs {
            proxy_pass http://claims_service/docs;
            proxy_set_header Host $host;
        }

        location /claims/redoc {
            proxy_pass http://claims_service/redoc;
            proxy_set_header Host $host;
        }

        # ── Billing Service ──────────────────────────────────────────────
        location /api/v1/billing/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://billing_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # ── Billing Service Docs ─────────────────────────────────────────
        location /billing/docs {
            proxy_pass http://billing_service/docs;
            proxy_set_header Host $host;
        }

        location /billing/redoc {
            proxy_pass http://billing_service/redoc;
            proxy_set_header Host $host;
        }

        # ── Pharmacy Service ─────────────────────────────────────────────
        location /api/v1/pharmacy/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://pharmacy_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # ── Service Health Endpoints (internal) ──────────────────────────
        location /pharmacy/health {
            proxy_pass http://pharmacy_service/health;
            proxy_set_header Host $host;
        }

        location /billing/health {
            proxy_pass http://billing_service/health;
            proxy_set_header Host $host;
        }

        location /claims/health {
            proxy_pass http://claims_service/health;
            proxy_set_header Host $host;
        }

        # ── Fallback: HMS Backend ────────────────────────────────────────
        location / {
            limit_req zone=api burst=50 nodelay;

            proxy_pass http://hms_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── WebSocket support moved to websocket-service upstream ─────
    }
}
