services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: hms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
      POSTGRES_DB: ${DB_NAME:-hms}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-hms}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hms-network

  # Redis (optional - for caching, sessions, etc.)
  redis:
    image: redis:7-alpine
    container_name: hms-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hms-network

  # HMS Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hms-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:5008"
    environment:
      NODE_ENV: production
      PORT: 5008
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-hms}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
      DB_DIALECT: postgres
      JWT_SECRET: ${JWT_SECRET:-8b3e0b4d6a2d9b5b7f3d7f1a4c6e8b9a0d2f4c6e8a1b3d5f7c9e1a3b5d7f9a1c2e4f6a8b0d2c4e6f8a1b3d5f7c9e1a}
      JWT_SECRET_REFRESH_TOKEN: ${JWT_SECRET_REFRESH_TOKEN}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY}
      RAPIDAPI_KEY: ${RAPIDAPI_KEY}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      PUSH_ENGAGE_APP_ID: ${PUSH_ENGAGE_APP_ID}
      PUSH_ENGAGE_API_KEY: ${PUSH_ENGAGE_API_KEY}
      PUSH_ENGAGE_API_SECRET: ${PUSH_ENGAGE_API_SECRET}
      REDIS_URL: redis://redis:6379
      # Microservice URLs
      PHARMACY_SERVICE_URL: http://pharmacy-service:3001
      PHARMACY_SERVICE_SECRET: ${SERVICE_AUTH_SECRET:-change-me-in-production}
      BILLING_SERVICE_URL: http://billing-service:8001
      CLAIMS_SERVICE_URL: http://claims-service:3002
      STORE_SERVICE_URL: http://store-service:3004
      THEATRE_SERVICE_URL: http://theatre-service:3005
      CONSULTATION_SERVICE_URL: http://consultation-service:3006
      MATERNITY_SERVICE_URL: http://maternity-service:3007
      ADMISSION_SERVICE_URL: http://admission-service:3003
      LAB_SERVICE_URL: http://lab-service:5012
      AUTH_SERVICE_URL: http://auth-service:3008
      SUBSCRIPTION_SERVICE_URL: http://subscription-service:3009
      NETWORK_SERVICE_URL: http://network-service:3011
      NOTIFICATION_SERVICE_URL: http://notification-service:3013
      PATIENT_PORTAL_SERVICE_URL: http://patient-portal-service:3012
      SERVICE_AUTH_SECRET: ${SERVICE_AUTH_SECRET:-change-me-in-production}
      # Supabase Storage (primary file storage)
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-hms-storage}
      # Legacy SFTP (backward compat — can be removed after full migration)
      BACKUP_STORAGE_HOST: ${BACKUP_STORAGE_HOST}
      BACKUP_STORAGE_PORT: ${BACKUP_STORAGE_PORT:-22}
      BACKUP_STORAGE_USER: ${BACKUP_STORAGE_USER}
      BACKUP_STORAGE_PASS: ${BACKUP_STORAGE_PASS}
      PUBLIC_STORAGE_URL: ${PUBLIC_STORAGE_URL}
    volumes:
      # Only mount uploads for legacy file access during migration
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5008/api/v1/system/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - hms-network

  # Auth Service (Node.js — port 3008)
  auth-service:
    image: devsolomon381/hms-auth-service:latest
    container_name: hms-auth-service
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3008:3008"
    environment:
      NODE_ENV: development
      PORT: 3008
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-hms}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
      DB_DIALECT: postgres
      JWT_SECRET: ${JWT_SECRET:-change-me}
      SERVICE_AUTH_KEY: ${SERVICE_AUTH_SECRET:-change-me-in-production}
      HMS_SERVICE_KEY: ${SERVICE_AUTH_SECRET:-change-me-in-production}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3008/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - hms-network

  # Subscription Service (Node.js — port 3009)
  subscription-service:
    image: devsolomon381/hms-subscription-service:latest
    container_name: hms-subscription-service
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3009:3009"
    environment:
      NODE_ENV: development
      PORT: 3009
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-hms}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      SERVICE_AUTH_SECRET: ${SERVICE_AUTH_SECRET:-change-me-in-production}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3009/api/v1/subscriptions/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - hms-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  hms-network:
    driver: bridge
