    environment:
      NODE_ENV: production
      PORT: 3009
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-hms}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      SERVICE_AUTH_SECRET: ${SERVICE_AUTH_SECRET:-change-me-in-production}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3009/api/v1/subscriptions/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));"]
