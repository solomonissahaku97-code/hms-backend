# =============================================================================
# HMS — Full Microservices Docker Compose (VPS Deployment)
# =============================================================================
#
# Infrastructure:
#   - PostgreSQL 15 (shared database)
#   - Redis 7 (cache + queue)
#
# Application Services (Docker Hub images):
#   - Backend (Node.js — port 3000:5008, proxied by host Nginx)
#   - Pharmacy Service (Node.js — port 3001)
#   - Billing Service (Python/FastAPI — port 8001)
#   - Claims Service (Python/FastAPI — port 3002)
#   - Admission Service (Node.js — port 3003)
#   - Store Service (Python/FastAPI — port 3004)
#   - Theatre Service (Node.js — port 3005)
#   - Consultation Service (Node.js — port 3006)
#   - Maternity Service (Python/FastAPI — port 3007)
#   - Lab Service (Node.js — port 5012)
#   - WebSocket Service (Node.js — port 3010)
#   - Auth Service (Node.js — port 3008)
#   - Notification Service (Node.js — port 3013)
#   - Patient Portal Service (Node.js — port 3012)
#
# Note: Nginx runs on the VPS host (not in Docker).
#       Host Nginx proxies api.tonitel.com → 127.0.0.1:3000
#
# Commands:
#   docker compose -f docker-compose.microservices.yml up -d
#   docker compose -f docker-compose.microservices.yml ps
#   docker compose -f docker-compose.microservices.yml logs -f claims-service
#   docker compose -f docker-compose.microservices.yml down
#
# =============================================================================

services:
  # ── Infrastructure ──────────────────────────────────────────────────────

  db:
    image: postgres:15-alpine
    container_name: hms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
      POSTGRES_DB: ${DB_NAME:-hms}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-hms}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hms-network

  redis:
    image: redis:7-alpine
    container_name: hms-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hms-network

  # ── HMS Backend (Main Monolith — port 3000:5008) ──────────────────────
  # Host Nginx proxies api.tonitel.com → 127.0.0.1:3000 → container:5008

  backend:
    image: devsolomon381/hms-backend:latest
    container_name: hms-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:5008"
    environment:
      NODE_ENV: production
      PORT: 5008
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-hms}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
      DB_DIALECT: postgres
      JWT_SECRET: ${JWT_SECRET:-change-me}
      JWT_SECRET_REFRESH_TOKEN: ${JWT_SECRET_REFRESH_TOKEN:-change-me}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-change-me}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      RAPIDAPI_KEY: ${RAPIDAPI_KEY:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      REDIS_URL: redis://redis:6379
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-hms-storage}
      PHARMACY_SERVICE_URL: http://pharmacy-service:3001
      PHARMACY_SERVICE_SECRET: ${SERVICE_AUTH_SECRET:-change-me-in-production}
      BILLING_SERVICE_URL: http://billing-service:8001
      BILLING_SERVICE_SECRET: ${SERVICE_AUTH_SECRET:-change-me-in-production}
      CLAIMS_SERVICE_URL: http://claims-service:3002
      CLAIMS_SERVICE_SECRET: ${SERVICE_AUTH_SECRET:-change-me-in-production}
      STORE_SERVICE_URL: http://store-service:3004
      THEATRE_SERVICE_URL: http://theatre-service:3005
      CONSULTATION_SERVICE_URL: http://consultation-service:3006
      MATERNITY_SERVICE_URL: http://maternity-service:3007
      ADMISSION_SERVICE_URL: http://admission-service:3003
      LAB_SERVICE_URL: http://lab-service:5012
      AUTH_SERVICE_URL: http://auth-service:3008
      SUBSCRIPTION_SERVICE_URL: http://subscription-service:3009
      NETWORK_SERVICE_URL: http://network-service:3011
      NOTIFICATION_SERVICE_URL: http://notification-service:3013
      PATIENT_PORTAL_SERVICE_URL: http://patient-portal-service:3012
    volumes:
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5008/api/v1/system/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - hms-network

  # ── Pharmacy Service (Node.js — port 3001) ─────────────────────────────

  pharmacy-service:
    image: devsolomon381/hms-pharmacy-service:latest
    container_name: hms-pharmacy-service
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-hms}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
      DB_DIALECT: postgres
      JWT_SECRET: ${JWT_SECRET:-change-me}
      HMS_BACKEND_URL: http://backend:5008
      HMS_SERVICE_KEY: ${SERVICE_AUTH_SECRET:-change-me-in-production}
      HMS_BACKEND_API_KEY: ${SERVICE_AUTH_SECRET:-change-me-in-production}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - hms-network

  # ── Billing Service (Python/FastAPI — port 8001) ───────────────────────

  billing-service:
    image: devsolomon381/hms-billing-service:latest
    container_name: hms-billing-service
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8001"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD:-postgres123}@db:5432/${DB_NAME:-hms}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      HMS_BACKEND_URL: http://backend:5008
      HMS_BACKEND_API_KEY: ${SERVICE_AUTH_SECRET:-change-me-in-production}
      PHARMACY_SERVICE_URL: http://pharmacy-service:3001
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8001/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - hms-network

  # ── Claims Service (Python/FastAPI — port 3002) ────────────────────────

  claims-service:
    image: devsolomon381/hms-claims-service:latest
    container_name: hms-claims-service
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD:-postgres123}@db:5432/${DB_NAME:-hms}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      HMS_BACKEND_URL: http://backend:5008
      HMS_SERVICE_KEY: ${SERVICE_AUTH_SECRET:-change-me-in-production}
      EXPORT_DIR: /app/exports
    volumes:
      - claims_exports:/app/exports
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:3002/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
