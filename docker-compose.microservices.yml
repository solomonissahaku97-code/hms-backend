      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3011/api/v1/network/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - hms-network

  # ── Notification Service (Node.js — port 3013) ────────────────────────

  notification-service:
    image: devsolomon381/hms-notification-service:latest
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: hms-notification-service
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3013:3013"
    environment:
      NODE_ENV: production
      PORT: 3013
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-hms}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
      DB_DIALECT: postgres
      JWT_SECRET: ${JWT_SECRET:-change-me}
      HMS_SERVICE_KEY: ${SERVICE_AUTH_SECRET:-change-me-in-production}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
      SMS_API_KEY: ${SMS_API_KEY:-}
      SMS_SENDER_ID: ${SMS_SENDER_ID:-Tonitel}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3013/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
