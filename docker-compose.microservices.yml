      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - hms-network

  # ── Network Service (Centralized Patient Network — port 3011) ───────────

  network-service:
    image: devsolomon381/hms-network-service:latest
    container_name: hms-network-service
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3011:3011"
    environment:
      NODE_ENV: production
      PORT: 3011
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-hms}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
