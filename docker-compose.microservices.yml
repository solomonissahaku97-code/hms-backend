    environment:
      NODE_ENV: production
      PORT: 3005
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-hms}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
      DB_DIALECT: postgres
      JWT_SECRET: ${JWT_SECRET:-change-me}
      HMS_BACKEND_URL: http://backend:5008
      HMS_SERVICE_KEY: ${SERVICE_AUTH_SECRET:-change-me-in-production}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3005/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - hms-network

  # ── Consultation Service (Node.js — port 3006) ───────────────────────

  consultation-service:
    image: devsolomon381/hms-consultation-service:latest
    container_name: hms-consultation-service
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3006:3006"
    environment:
      NODE_ENV: production
      PORT: 3006
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-hms}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
      DB_DIALECT: postgres
      JWT_SECRET: ${JWT_SECRET:-change-me}
      HMS_BACKEND_URL: http://backend:5008
      HMS_SERVICE_KEY: ${SERVICE_AUTH_SECRET:-change-me-in-production}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3006/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - hms-network

  # ── Maternity Service (Python/FastAPI — port 3007) ─────────────────────

  maternity-service:
    image: devsolomon381/hms-maternity-service:latest
    container_name: hms-maternity-service
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3007:3007"
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD:-postgres123}@db:5432/${DB_NAME:-hms}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      HMS_SERVICE_KEY: ${SERVICE_AUTH_SECRET:-change-me-in-production}
      PORT: 3007
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:3007/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - hms-network

  # ── Lab Service (Node.js — port 5012) ─────────────────────────────────

  lab-service:
    image: devsolomon381/hms-lab-service:latest
    container_name: hms-lab-service
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "5012:5012"
    environment:
      NODE_ENV: production
      PORT: "5012"
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-hms}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
      DB_DIALECT: postgres
      JWT_SECRET: ${JWT_SECRET:-change-me}
      SERVICE_AUTH_SECRET: ${SERVICE_AUTH_SECRET:-change-me-in-production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5012/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - hms-network

  # ── WebSocket Service (Node.js — port 3010) ─────────────────────────────

  websocket-service:
    image: devsolomon381/hms-websocket-service:latest
    container_name: hms-websocket-service
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "3010:3010"
    environment:
      PORT: "3010"
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me}
