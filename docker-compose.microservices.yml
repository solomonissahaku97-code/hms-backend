# =============================================================================
# HMS — Full Microservices Docker Compose
# =============================================================================
#
# Services:
#   - PostgreSQL (shared database)
#   - Redis (cache + queue)
#   - Nginx (reverse proxy — single entry point on port 80)
#   - HMS Backend (Node.js monolith — port 5008)
#   - Pharmacy Service (Node.js — port 3001)
#   - Billing Service (Python/FastAPI — port 8001)
#   - Claims Service (Python/FastAPI — port 3002)
#
# Commands:
#   docker compose -f docker-compose.microservices.yml up -d --build
#   docker compose -f docker-compose.microservices.yml ps
#   docker compose -f docker-compose.microservices.yml logs -f claims-service
#   docker compose -f docker-compose.microservices.yml down
#
# =============================================================================

services:
  # ── Infrastructure ──────────────────────────────────────────────────────

  db:
    image: postgres:15-alpine
    container_name: hms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
      POSTGRES_DB: ${DB_NAME:-hms}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-hms}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hms-network

  redis:
    image: redis:7-alpine
    container_name: hms-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hms-network

  # ── Nginx (Reverse Proxy — single entry point on port 80) ─────────────

  nginx:
    image: nginx:1.25-alpine
    container_name: hms-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - pharmacy-service
      - billing-service
      - claims-service
      - lab-service
      - admission-service
      - store-service
      - theatre-service
      - consultation-service
      - maternity-service
    networks:
      - hms-network

  # ── HMS Backend (Main Monolith — port 5008) ────────────────────────────

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hms-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "5008:5008"
    environment:
      NODE_ENV: production
      PORT: 5008
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-hms}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
      DB_DIALECT: postgres
      JWT_SECRET: ${JWT_SECRET:-change-me}
      JWT_SECRET_REFRESH_TOKEN: ${JWT_SECRET_REFRESH_TOKEN:-change-me}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-change-me}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      RAPIDAPI_KEY: ${RAPIDAPI_KEY:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      REDIS_URL: redis://redis:6379
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-hms-storage}
      PHARMACY_SERVICE_URL: http://pharmacy-service:3001
      PHARMACY_SERVICE_SECRET: ${SERVICE_AUTH_SECRET:-change-me-in-production}
      BILLING_SERVICE_URL: http://billing-service:8001
      BILLING_SERVICE_SECRET: ${SERVICE_AUTH_SECRET:-change-me-in-production}
      CLAIMS_SERVICE_URL: http://claims-service:3002
      CLAIMS_SERVICE_SECRET: ${SERVICE_AUTH_SECRET:-change-me-in-production}
    volumes:
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5008/api/v1/system/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - hms-network

  # ── Pharmacy Service (Node.js — port 3001) ─────────────────────────────

  pharmacy-service:
    build:
      context: ./pharmacy-service
      dockerfile: Dockerfile
    container_name: hms-pharmacy-service
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-hms}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
      DB_DIALECT: postgres
      JWT_SECRET: ${JWT_SECRET:-change-me}
      HMS_BACKEND_URL: http://backend:5008
      HMS_SERVICE_KEY: ${SERVICE_AUTH_SECRET:-change-me-in-production}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - hms-network

  # ── Billing Service (Python/FastAPI — port 8001) ───────────────────────

  billing-service:
    build:
      context: ./billing-service
      dockerfile: Dockerfile
    container_name: hms-billing-service
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8001"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD:-postgres123}@db:5432/${DB_NAME:-hms}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      HMS_BACKEND_URL: http://backend:5008
      HMS_BACKEND_API_KEY: ${SERVICE_AUTH_SECRET:-change-me-in-production}
      PHARMACY_SERVICE_URL: http://pharmacy-service:3001
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8001/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - hms-network

  # ── Claims Service (Python/FastAPI — port 3002) ────────────────────────

  claims-service:
    build:
      context: ./claims-service
      dockerfile: Dockerfile
    container_name: hms-claims-service
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD:-postgres123}@db:5432/${DB_NAME:-hms}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      HMS_BACKEND_URL: http://backend:5008
      HMS_SERVICE_KEY: ${SERVICE_AUTH_SECRET:-change-me-in-production}
      EXPORT_DIR: /app/exports
    volumes:
      - claims_exports:/app/exports
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:3002/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - hms-network

  # ── Admission Service (Node.js — port 3003) ──────────────────────────

  admission-service:
    build:
      context: ./admission-service
      dockerfile: Dockerfile
    container_name: hms-admission-service
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3003:3003"
    environment:
      NODE_ENV: production
      PORT: 3003
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-hms}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
      DB_DIALECT: postgres
      JWT_SECRET: ${JWT_SECRET:-change-me}
      HMS_BACKEND_URL: http://backend:5008
      HMS_SERVICE_KEY: ${SERVICE_AUTH_SECRET:-change-me-in-production}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3003/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - hms-network

  # ── Store Service (Python/FastAPI — port 3004) ─────────────────────────

  store-service:
    image: devsolomon381/hms-store-service:latest
    container_name: hms-store-service
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3004:3004"
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD:-postgres123}@db:5432/${DB_NAME:-hms}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      HMS_SERVICE_KEY: ${SERVICE_AUTH_SECRET:-change-me-in-production}
      PORT: 3004
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:3004/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - hms-network

  # ── Theatre Service (Node.js — port 3005) ─────────────────────────────

  theatre-service:
    build:
      context: ./theatre-service
      dockerfile: Dockerfile
    container_name: hms-theatre-service
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3005:3005"
    environment:
      NODE_ENV: production
      PORT: 3005
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-hms}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
      DB_DIALECT: postgres
      JWT_SECRET: ${JWT_SECRET:-change-me}
      HMS_BACKEND_URL: http://backend:5008
      HMS_SERVICE_KEY: ${SERVICE_AUTH_SECRET:-change-me-in-production}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3005/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - hms-network

  # ── Consultation Service (Node.js — port 3006) ───────────────────────

  consultation-service:
    build:
      context: ./consultation-service
      dockerfile: Dockerfile
    container_name: hms-consultation-service
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3006:3006"
    environment:
      NODE_ENV: production
      PORT: 3006
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-hms}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
      DB_DIALECT: postgres
      JWT_SECRET: ${JWT_SECRET:-change-me}
      HMS_BACKEND_URL: http://backend:5008
      HMS_SERVICE_KEY: ${SERVICE_AUTH_SECRET:-change-me-in-production}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3006/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - hms-network

  # ── Maternity Service (Python/FastAPI — port 3007) ─────────────────────

  maternity-service:
    build:
      context: ./maternity-service
      dockerfile: Dockerfile
    container_name: hms-maternity-service
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3007:3007"
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD:-postgres123}@db:5432/${DB_NAME:-hms}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      HMS_SERVICE_KEY: ${SERVICE_AUTH_SECRET:-change-me-in-production}
      PORT: 3007
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:3007/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - hms-network

  # ── Lab Service (Node.js — port 5012) ─────────────────────────────────

  lab-service:
    build:
      context: ./lab-service
      dockerfile: Dockerfile
    container_name: hms-lab-service
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "5012:5012"
    environment:
      NODE_ENV: production
      PORT: "5012"
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-hms}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
      DB_DIALECT: postgres
      JWT_SECRET: ${JWT_SECRET:-change-me}
      SERVICE_AUTH_SECRET: ${SERVICE_AUTH_SECRET:-change-me-in-production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5012/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - hms-network

  # ── WebSocket Service (Node.js — port 3010) ─────────────────────────────

  websocket-service:
    build:
      context: ./websocket-service
      dockerfile: Dockerfile
    container_name: hms-websocket-service
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "3010:3010"
    environment:
      PORT: "3010"
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me}
      HMS_SERVICE_KEY: ${SERVICE_AUTH_SECRET:-change-me-in-production}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3010/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - hms-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  claims_exports:
    driver: local

networks:
  hms-network:
    driver: bridge
