      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3012/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - hms-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  claims_exports:
    driver: local

networks:
  hms-network:
    driver: bridge
