      retries: 3
      start_period: 10s
    networks:
      - hms-network

  # ── Auth Service (Node.js — port 3008) ──────────────────────────────
  # Handles: login, token verification, user lookup, password reset.
  # Registration stays on monolith (file upload, SFTP, institution setup).

  auth-service:
    image: devsolomon381/hms-auth-service:latest
    container_name: hms-auth-service
    restart: unless-stopped
    depends_on:
